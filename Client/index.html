<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradia · Student Result Management System</title>
    <meta name="description" content="Gradia is a student result management system: enter marks, compile result sheets, route approvals, and publish results in one clean workflow." />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171d" />
    <link rel="icon" type="image/svg+xml" href="/gradia.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gradia" />
    <meta property="og:title" content="Gradia · Student Result Management System" />
    <meta property="og:description" content="Enter marks, compile result sheets, route approvals, and publish results in one clean workflow." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gradia · Student Result Management System" />
    <meta name="twitter:description" content="Enter marks, compile result sheets, route approvals, and publish results in one clean workflow." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Initial loading styles - inline to show immediately before React hydrates -->
    <style>
      :root {
        --bg: #f3f5f6;
        --fg: #1a1d23;
        --muted: #8d939c;
        --primary: #0e7490;
        --surface: #f8f9fa;
        --border: #dfe3e7;
        --glass-base: 255, 255, 255;
        --glass-border: 226, 232, 240;
        --glass-floating-alpha: 0.8;
        --glass-panel-alpha: 0.6;
        --ambient-primary: 14, 116, 144;
        --ambient-primary-alpha: 0.08;
        --ambient-secondary: 148, 158, 169;
        --ambient-secondary-alpha: 0.06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171d;
          --fg: #f4f6f8;
          --muted: #767e8a;
          --primary: #22d3ee;
          --surface: #1b1f26;
          --border: #2b313b;
          --glass-base: 20, 23, 29;
          --glass-border: 43, 49, 59;
          --glass-floating-alpha: 0.2;
          --glass-panel-alpha: 0.1;
          --ambient-primary: 34, 211, 238;
          --ambient-primary-alpha: 0.04;
          --ambient-secondary: 200, 210, 220;
          --ambient-secondary-alpha: 0.02;
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: "Plus Jakarta Sans", "Plus Jakarta Sans Fallback", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        transition: background-color 300ms ease, color 300ms ease;
      }
      .init-load {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 1.5rem;
        background-image:
          radial-gradient(42rem 42rem at 88% -10%, rgba(var(--ambient-primary), calc(var(--ambient-primary-alpha) * 0.65)), transparent 70%),
          radial-gradient(36rem 36rem at -8% 105%, rgba(var(--ambient-secondary), calc(var(--ambient-secondary-alpha) * 0.7)), transparent 70%),
          linear-gradient(to right, color-mix(in srgb, var(--border) 45%, transparent) 1px, transparent 1px),
          linear-gradient(to bottom, color-mix(in srgb, var(--border) 45%, transparent) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
      }
      .init-load__card {
        width: 100%;
        max-width: 28rem;
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        text-align: center;
        border: 1px solid transparent;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.015) 45%, transparent 70%) padding-box,
          rgba(24,27,33,0.5) padding-box,
          linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05) 55%, rgba(var(--ambient-primary),0.26)) border-box;
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        box-shadow: 0 12px 40px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.12);
      }
      @media (prefers-color-scheme: light) {
        .init-load__card {
          background:
            linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.14) 45%, transparent 70%) padding-box,
            rgba(255,255,255,0.55) padding-box,
            linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.45) 55%, rgba(var(--ambient-primary),0.35)) border-box;
          box-shadow: 0 12px 40px rgba(23,27,33,0.1), inset 0 1px 0 rgba(255,255,255,0.92);
        }
      }
      .init-load__icon {
        position: relative;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
      }
      .init-load__ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 2.5px solid color-mix(in srgb, var(--primary) 18%, transparent);
        border-top-color: var(--primary);
        animation: init-spin 0.9s linear infinite;
      }
      @keyframes init-spin { to { transform: rotate(360deg); } }
      .init-load__doc {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .init-load__doc svg { width: 2.5rem; height: 2.5rem; color: var(--primary); }
      .init-load__label { font-size: 0.875rem; font-weight: 500; color: var(--muted); }
      .init-load__dots { display: flex; gap: 0.375rem; justify-content: center; margin-top: 1rem; }
      .init-load__dot { width: 0.375rem; height: 0.375rem; border-radius: 9999px; background: var(--primary); animation: init-pulse 0.6s easeInOut infinite; }
      .init-load__dot:nth-child(2) { animation-delay: 0.15s; }
      .init-load__dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes init-pulse { 0%,100% { transform: scale(0.5); } 50% { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        .init-load__ring, .init-load__dot { animation: none !important; }
        .init-load__dot { transform: scale(1) !important; opacity: 1 !important; }
      }
      /* Hide initial loader once React hydrates */
      .init-load[data-hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <!-- Initial loading screen - shows immediately before React loads -->
    <div class="init-load" id="init-loader" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Gradia">
      <div class="init-load__card">
        <div class="init-load__icon" aria-hidden="true">
          <span class="init-load__ring"></span>
          <svg class="init-load__doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <path d="M10 13 12 15 16 11" stroke-width="2" stroke="var(--primary)" />
          </svg>
        </div>
        <p class="init-load__label">Loading Gradia</p>
        <div class="init-load__dots" aria-hidden="true">
          <span class="init-load__dot"></span>
          <span class="init-load__dot"></span>
          <span class="init-load__dot"></span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide initial loader once React has hydrated
      const hideLoader = () => {
        const loader = document.getElementById('init-loader');
        if (loader) {
          loader.setAttribute('data-hidden', '');
          setTimeout(() => loader.remove(), 200);
        }
      };

      if (document.readyState === 'complete') {
        hideLoader();
      } else {
        window.addEventListener('load', hideLoader);
      }
    </script>
  </body>
</html>
